# The linters are pinned beside the toolchain because both of them police
# `bin/*` and `.github/workflows/*`, and an unpinned linter changes the gate's
# verdict without a diff.
# mise provisions every tool here into the user's own prefix, so no gate ever
# needs sudo. CI installs its own copies from pacman and accepts the version
# skew: both linters fail loudly, so a newer server-side rule surfaces as a red
# run rather than as a silently skipped check.
#
# lefthook runs the pre-commit hook in lefthook.yml, whose min_version refuses
# any lefthook older than this pin, so a global install no longer decides what
# a commit runs; bin/check-fast's lefthook pin gate holds the two equal. The
# postinstall hook below writes the hook into .git/hooks, which every worktree
# shares, so `mise install` sets up both, and running it again rewrites the
# hook after a change to lefthook.yml beyond its jobs. It does so only in the
# main checkout, whose .git is a directory, though mise runs the postinstall on
# every `mise install`, in the directory of whichever copy of this file it
# reads. In a linked worktree, whose .git is a file, lefthook install would
# write the hook every worktree shares from that worktree's lefthook.yml; in a
# copy without .git, such as the release's source archive, it would find
# whatever repository holds the copy, write a lefthook.yml into it and install
# its hooks there. lefthook install run by hand in a worktree still rewrites
# the shared hook. CI runs bin/test rather than the hook, and installs no
# lefthook.
#
# cargo-llvm-cov and the toolchain's llvm-tools component are what bin/test's
# core coverage gate runs on. CI installs the cargo-llvm-cov .llvm-cov-version
# names, and this pin is the same version, which bin/test's cargo-llvm-cov
# mise pin gate holds equal. It comes first because mise puts its tools on PATH
# in this order and the rust entry brings ~/.cargo/bin with it, so a copy that
# `cargo install` left there cannot shadow it. The components are listed here
# as well as in rust-toolchain.toml because mise exports RUSTUP_TOOLCHAIN from
# the rust pin, which outranks that file, components and all; `mise install`
# adds any that an installed toolchain lacks.
#
# The [hooks] table is also why mise reads this file only once it is trusted.
# `mise install` trusts the checkout it runs in, and a linked worktree shares
# the trust of its main checkout, but a copy anywhere else starts untrusted,
# and a mise shim run beside an untrusted copy dies before its tool starts.
# bin/check-gates trusts its scratch copy for that reason.
[tools]
"aqua:taiki-e/cargo-llvm-cov" = "0.9.0"
rust = { version = "1.98.0", components = ["rustfmt", "clippy", "llvm-tools"] }
actionlint = "1.7.12"
shellcheck = "0.11.0"
lefthook = "2.1.16"

[hooks]
postinstall = "if [ -d .git ]; then lefthook install; fi"
