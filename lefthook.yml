# The lefthook mise.toml pins, and nothing older. The hook runs the first
# lefthook on PATH, and a PATH that mise did not set up for this checkout can
# carry a global install, which can predate the fixes that commits in linked
# worktrees need: 2.1.16 and 2.1.17 fail any commit there that leaves a file
# partly staged, before 2.2.1 every worktree hid its unstaged changes in the
# same patch file, and before 2.2.2 each commit dropped the other worktrees'
# backups of them from the stash they all share. So an older one refuses to
# run the hook instead. lefthook checks this before it runs a job or touches a
# hook, and bin/check-fast's lefthook pin gate holds it to the pin in
# mise.toml. 2.2.2 still drops its own backup by its position in that stash,
# which another worktree's stash can shift (evilmartians/lefthook#1619).
min_version: "2.2.2"

# A commit fails when the hook finds no lefthook at all. Without this, the hook
# script lefthook writes says it cannot find lefthook and lets the commit
# through unchecked: a --no-verify nobody chose. lefthook writes the setting
# into the hook when it installs it, so a change here reaches .git/hooks with
# the next `mise install` in the main checkout, whose postinstall runs
# `lefthook install`.
assert_lefthook_installed: true

# Every worktree shares one .git/hooks, and by default `lefthook run` rewrites
# the hooks whenever the lefthook.yml it reads differs from the one they were
# installed from, so a worktree on another commit would rewrite the hook every
# other checkout runs. `mise install` in the main checkout installs them
# instead, and is the step to repeat after a change here beyond the jobs, such
# as a new hook or one of these settings. In a linked worktree it leaves them
# alone, but `lefthook install` run by hand there still rewrites them from that
# worktree's lefthook.yml, and so does a commit in a worktree whose lefthook.yml
# lacks this key, or whose lefthook-local file turns it off. lefthook's config
# files are protected paths, so Factory flags a branch that drops the key or
# adds such a file, but only after that commit.
no_auto_install: true

# Formatting and the text-only gates, and nothing that needs a compiler.
# Clippy belongs to bin/test and CI, not to every commit: clippy and test
# invalidate each other's cxx-qt build fingerprints, so running it here costs a
# full ~22-minute C++ regeneration before a commit can land. A hook that
# expensive teaches --no-verify, which then loses the fmt check too.
#
# bin/check-fast is the same script bin/test runs first, so the hook can never
# hold a weaker opinion than the server does. It reads tracked text only and
# finishes in about a quarter of a second, which is what keeps it welcome here.
pre-commit:
  parallel: true
  jobs:
    - name: cargo-fmt
      run: cargo fmt --all --check
    - name: check-fast
      run: ./bin/check-fast
