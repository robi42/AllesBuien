[package]
name = "allesbuien-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
jiff = { version = "0.2.35", features = ["tzdb-bundle-always"] }

[dev-dependencies]
tempfile = "3"
