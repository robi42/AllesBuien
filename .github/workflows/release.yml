name: Release

on:
  push:
    tags:
      - "v*"

# Nothing at the top: each job names what it needs. The build job, which runs
# every dependency's build script and proc macro, can only read; the publish
# job, which runs none of them, holds the only token that can write.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: archlinux:base-devel
    permissions:
      contents: read
    # The name the build's artifact goes under, which carries the run attempt.
    # A whole re-run uploads its build under a name of its own instead of
    # beside the earlier attempt's under the same one, where download-artifact,
    # which returns the artifact with the highest ID, could pick either; a
    # re-run of the publish job alone still reads the name its build set.
    outputs:
      artifact: release-assets-${{ github.run_attempt }}
    env:
      QMAKE: /usr/bin/qmake6
      # GNU gold cannot resolve the whole-archive initialiser symbols CXX-Qt
      # emits, so the release binary has to link exactly the way CI's does.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
      # The toolchain is installed once as root and read by the unprivileged
      # builder, so its home is shared and its package cache is not: cargo
      # writes to CARGO_HOME, and builder cannot write under /usr/local.
      RUSTUP_HOME: /usr/local/rustup
      CARGO_HOME: /home/builder/.cargo
    steps:
      # Ahead of the checkout on purpose. Without git in the image the checkout
      # action falls back to the REST API tarball, which leaves a source tree
      # but no repository; the package is built from a checkout like the one
      # CI tests.
      #
      # rustup rather than pacman's rust: bin/build asserts Cargo 1.99.1 to match
      # rust-toolchain.toml, and a rolling distribution ships whatever it ships.
      - name: Install release dependencies
        run: |
          pacman -Syu --noconfirm --needed git rustup lld qt6-base qt6-declarative
          rustup default 1.99.1
          chmod -R a+rX /usr/local/rustup

      # Nothing after this step talks to GitHub through git. Persisted, the
      # job's token would sit in a world-readable file under RUNNER_TEMP,
      # included from .git/config, while the build runs every dependency's
      # build script and proc macro.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The workspace is bind-mounted from the host and owned by the runner
      # account while the container is root, so git refuses it as dubious
      # ownership. The checkout action grants itself an exception in a global
      # config it discards on return; every later step needs its own.
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Before any build work, so a mistyped tag costs seconds rather than a
      # full Qt compile. pkgver is static by design, which is exactly why
      # nothing but a check keeps it honest.
      - name: Verify the tag, the crates and the package agree
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -1)
          core_version=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
          pkg_version=$(sed -n 's/^pkgver=//p' pkgbuild/PKGBUILD | head -1)
          printf 'tag=%s app=%s core=%s pkgver=%s\n' \
            "$tag_version" "$app_version" "$core_version" "$pkg_version"
          for name in app_version core_version pkg_version; do
            if [[ "${!name}" != "$tag_version" ]]; then
              printf 'error: %s is %s but the tag claims %s\n' \
                "$name" "${!name}" "$tag_version" >&2
              exit 1
            fi
          done

      - name: Create unprivileged builder
        run: useradd -m builder && chown -R builder .

      # makepkg refuses to run as root. Without --login, su sets only HOME and
      # SHELL, and USER and LOGNAME for builder, plus PATH where /etc/default/su
      # or /etc/login.defs sets ALWAYS_SET_PATH to yes, before PAM makes the
      # final changes. So the rest of this step's environment, the job's env
      # above included, reaches builder's shell and the makepkg it runs, and
      # nothing the build must not see may ever be in it; the toolchain path and
      # the variables the build reads are still exported rather than assumed.
      - name: Build package
        run: |
          # The single quotes are the point: $PATH has to reach builder's shell
          # unexpanded so it resolves to builder's own path, not root's.
          # shellcheck disable=SC2016
          su builder -c '
            export PATH=/usr/local/rustup/toolchains/1.99.1-x86_64-unknown-linux-gnu/bin:$PATH
            export RUSTUP_HOME=/usr/local/rustup
            export CARGO_HOME=/home/builder/.cargo
            export QMAKE=/usr/bin/qmake6
            export RUSTFLAGS="-C link-arg=-fuse-ld=lld"
            cd pkgbuild && makepkg -f
          '

      # The publish job uploads exactly these bytes, and a re-run of that job
      # alone should find them again for as long as the artifact is kept.
      - name: Hand the package to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The job's artifact output above names the same.
          name: release-assets-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: pkgbuild/*.pkg.tar.zst

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Creates the draft release and uploads its assets. No step in this job
      # runs code from this repository or its dependencies.
      contents: write
    steps:
      # The source archive is made here, from this job's own checkout, rather
      # than in the build job, where `chown -R builder .` hands the build the
      # repository and anything made from it, so a compromised build could
      # rewrite the archive. git archive runs nothing from the repository: it
      # only reads the tagged commit's tree. Nothing after this step talks to
      # GitHub through git, so this checkout keeps no credentials either.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create source archive
        run: git archive --format=tar.gz -o "allesbuien-${GITHUB_REF_NAME}-src.tar.gz" HEAD

      # upload-artifact drops pkgbuild/, the part of its path before the first
      # wildcard, and one artifact named here is extracted straight into path,
      # so the package lands in dist itself.
      - name: Fetch the built package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      # Leaves a draft for a person to inspect and publish, as README's
      # Releasing section describes: with immutable releases on, publishing
      # locks the tag and the assets for good, while a draft can still be
      # deleted and built again. With draft set, the action never publishes.
      #
      # target_commitish stays unset: GitHub ignores it for a tag that already
      # exists, and answers this job's token with a 404 when it names a commit
      # that adds or modifies a file under .github/workflows/ relative to the
      # default branch.
      - name: Upload release assets to a draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/*.pkg.tar.zst
            allesbuien-${{ github.ref_name }}-src.tar.gz
