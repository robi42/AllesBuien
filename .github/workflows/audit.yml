name: audit

# Weekly rather than per-push: an advisory published upstream is not a defect in
# the commit that happens to arrive next, and failing unrelated work for it is
# how a solo maintainer ends up reaching for continue-on-error - which leaves a
# gate that can never fail. Dependabot already opens the remediation PR; this
# just makes sure nobody has to remember to look.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    # A run takes about a minute; a hung one would otherwise hold the runner for
    # GitHub's default of six hours.
    timeout-minutes: 15
    steps:
      # cargo-deny needs no token from the checkout: it fetches the public
      # advisory database into a directory of its own, and takes git credentials
      # only from the action's credentials and ssh-key inputs, both unset here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
