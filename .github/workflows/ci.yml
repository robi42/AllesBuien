name: CI

on:
  # push is scoped to main so a branch that has an open pull request runs once,
  # through the pull_request event, instead of once per event with the same
  # SHA. Fork branches only ever fire pull_request, so nothing is lost there,
  # and tag pushes belong to release.yml.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run its previous push started, so a
# pull request has at most one run going, the one for its newest commit. An
# outside contributor's runs start only once the maintainer approves them, so
# this and the quality job's timeout bound the runs that do start: approved
# ones, the owner's, and Dependabot's.
#
# Each push to main is a group of its own, keyed by run: in a shared group
# GitHub keeps at most one run pending and cancels it when a newer one arrives,
# cancel-in-progress or not, and every commit on main is one somebody may tag.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    # A cold run takes just over twenty minutes; a hung GUI harness would
    # otherwise hold the runner for GitHub's default of six hours.
    timeout-minutes: 45
    container: archlinux:base-devel
    env:
      QMAKE: /usr/bin/qmake6
      # Job-level rather than per-step: GNU gold cannot resolve the whole-archive
      # initialiser symbols CXX-Qt emits, so every cargo invocation in the job has
      # to link the same way. Scoping it to the test step alone also gave clippy
      # and test different fingerprints, so each rebuilt the other's artefacts.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      # Ahead of the checkout on purpose. Without git in the image the checkout
      # action silently falls back to the REST API tarball, which leaves a source
      # tree but no repository, and the module-size gate enumerates its files
      # with git ls-files.
      #
      # shellcheck and actionlint come from pacman rather than from the mise
      # pins the working copy uses. The skew is deliberate and bounded: both are
      # linters, both fail loudly, and a rule a newer release adds surfaces as a
      # red run here instead of as a check that quietly stopped applying.
      - name: Install system dependencies and Rust
        run: pacman -Syu --noconfirm git rustup qt6-base qt6-declarative shellcheck actionlint && rustup default 1.98.0 && rustup component add llvm-tools-preview

      # No later step talks to GitHub through git. Persisted, the job's token
      # would stay in a file under RUNNER_TEMP, included from .git/config, where
      # every later step could read it, and bin/test runs the pull request's own
      # code. The token can only read, so this is hygiene rather than a fix.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The workspace is bind-mounted from the host and owned by the runner
      # account, while the container is root, so git refuses it as dubious
      # ownership. The checkout action grants itself an exception in a global
      # config it throws away when it returns; a later step has to grant its
      # own, and the module-size gate is a later step.
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Every run restores main's cache, and only a push to main saves one. An
      # entry is about 1.8 GB, a pull request's could serve only that pull
      # request's own later runs, and once the repository's caches pass 10 GB,
      # GitHub evicts the least recently used entries, main's among them.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Read cargo-llvm-cov version
        id: llvm-cov-version
        shell: bash
        run: echo "version=$(<.llvm-cov-version)" >> "$GITHUB_OUTPUT"

      # fallback: none for the reason the cargo-about steps below give.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@${{ steps.llvm-cov-version.outputs.version }}
          fallback: none

      # bin/test's third-party notices gate compares the committed notices with
      # what this cargo-about writes from Cargo.lock, so CI installs the version
      # .cargo-about-version names, the one bin/test holds mise.toml's pin to.
      # With fallback: none, a version install-action's manifest does not know
      # fails this step, instead of falling back to cargo-binstall, which the
      # action hands the job's token.
      - name: Read cargo-about version
        id: cargo-about-version
        shell: bash
        run: echo "version=$(<.cargo-about-version)" >> "$GITHUB_OUTPUT"

      - name: Install cargo-about
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-about@${{ steps.cargo-about-version.outputs.version }}
          fallback: none

      # One step, one source of truth. Restating the gates here let the server
      # and the working copy disagree: the module-size budget and the pinned
      # cargo-llvm-cov version only ever ran locally, and CI kept its own copy of
      # the core-purity check long after that copy was found unable to fail.
      - name: Run quality gates
        run: ./bin/test
