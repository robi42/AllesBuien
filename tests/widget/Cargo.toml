[package]
name = "allesbuien-widget-tests"
# No version of its own: this crate ships nothing and is not a release surface,
# so it carries Cargo's default rather than one more number to bump.
edition = "2024"
license = "MIT"
publish = false

[lints]
workspace = true

# Deliberately dependency-free: the proofs it runs are shell and QML, and the
# four tests only start bash, shellcheck and qmltestrunner and report what
# they say.
