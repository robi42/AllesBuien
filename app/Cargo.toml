[package]
name = "allesbuien"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Dutch weather and rain radar for Omarchy"
repository = "https://github.com/robi42/AllesBuien"
publish = false

[lints]
workspace = true

[dependencies]
allesbuien-core = { path = "../core" }
cxx = "1.0"
cxx-qt = { workspace = true }
cxx-qt-lib = { workspace = true, features = ["qt_gui", "qt_qml"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }

[dev-dependencies]
allesbuien-harness = { path = "harness" }
allesbuien-testkit = { path = "testkit" }
tempfile = "3"

[build-dependencies]
cxx-qt-build = { workspace = true }
