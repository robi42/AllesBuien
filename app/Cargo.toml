[package]
name = "allesbuien"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
allesbuien-core = { path = "../core" }
cxx = "1.0"
cxx-qt = { workspace = true }
cxx-qt-lib = { workspace = true, features = ["qt_gui", "qt_qml"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cxx-qt-build = { workspace = true }
